<!DOCTYPE html>
<html>
<head>
    <title>Test Settings</title>
</head>
<body>
    <h1>Test Settings Form</h1>
    <form action="http://localhost:5136/Admin/Settings/UpdateGeneral" method="post">
        <label>Site Name:</label>
        <input type="text" name="SiteName" value="My Test Store" /><br><br>
        
        <label>Site Description:</label>
        <input type="text" name="SiteDescription" value="Best online shopping experience" /><br><br>
        
        <label>Contact Email:</label>
        <input type="email" name="ContactEmail" value="contact@teststore.com" /><br><br>
        
        <label>Contact Phone:</label>
        <input type="text" name="ContactPhone" value="123-456-7890" /><br><br>
        
        <label>Address:</label>
        <input type="text" name="Address" value="123 Test Street" /><br><br>
        
        <label>Currency:</label>
        <input type="text" name="Currency" value="USD" /><br><br>
        
        <label>Time Zone:</label>
        <input type="text" name="TimeZone" value="UTC" /><br><br>
        
        <label>Language:</label>
        <input type="text" name="Language" value="en" /><br><br>
        
        <label>Items Per Page:</label>
        <input type="number" name="ItemsPerPage" value="12" /><br><br>
        
        <label>Enable Registration:</label>
        <input type="checkbox" name="EnableRegistration" value="true" checked /><br><br>
        
        <label>Enable Reviews:</label>
        <input type="checkbox" name="EnableReviews" value="true" checked /><br><br>
        
        <label>Enable Wishlist:</label>
        <input type="checkbox" name="EnableWishlist" value="true" checked /><br><br>
        
        <input type="submit" value="Save Settings" />
    </form>
</body>
</html>
